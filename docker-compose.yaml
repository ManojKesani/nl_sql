services:
  api:
    build: .
    env_file: .env
    environment:
      MCP_URL: http://mcp:8001/mcp
    depends_on:
      - mcp


  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api 
  
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
  mcp:
    build: .
    command: python db_server.py