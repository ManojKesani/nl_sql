[project]
name = "nl-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ManojKesani", email = "mehermanoj45@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openrouter>=0.2.9",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
nl-sql = "nl_sql:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
